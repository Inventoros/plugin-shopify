name: Release

# A tag publishes the exact ZIP that passed the CI database matrix and the
# real install/activate/delete cycle. Verification has no publishing rights.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  PLUGIN_SLUG: shopify

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml
    with:
      inventoros_ref: main

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Check the tag matches plugin.json
        working-directory: plugin
        run: |
          version=$(php -r 'echo json_decode(file_get_contents("plugin.json"), true, 512, JSON_THROW_ON_ERROR)["version"];')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $version" >&2
            exit 1
          fi
          grep -Fq "## [$version]" CHANGELOG.md || { echo "CHANGELOG.md has no [$version] section" >&2; exit 1; }

      - name: Download the verified ZIP
        uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: plugin/build

      - name: Verify the release archive checksum
        working-directory: plugin
        run: |
          version=$(php -r 'echo json_decode(file_get_contents("plugin.json"), true, 512, JSON_THROW_ON_ERROR)["version"];')
          zip="build/${PLUGIN_SLUG}-${version}.zip"
          printf '%s  %s\n' "$(cat "${zip}.sha256")" "$zip" | sha256sum --check -

      - name: Publish the GitHub release
        working-directory: plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v heading="## [$version]" '
            /^## \[/ { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" \
            "build/${PLUGIN_SLUG}-${version}.zip" \
            "build/${PLUGIN_SLUG}-${version}.zip.sha256" \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
