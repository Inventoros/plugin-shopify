name: CI

# The plugin's tests run INSIDE Inventoros: CI checks out the core at
# INVENTOROS_REF, puts this repository at plugins/<slug>, installs the core's
# dependencies and runs this plugin's PHPUnit suite with the core's test
# harness. Then it builds the release ZIP and installs, activates and deletes
# it through the core's real installer.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      inventoros_ref:
        description: 'Inventoros branch, tag or SHA to test against'
        required: false
        type: string
        default: main
  workflow_call:
    inputs:
      inventoros_ref:
        description: 'Inventoros branch, tag or SHA to test against'
        required: false
        type: string
        default: main

permissions:
  contents: read

env:
  PLUGIN_SLUG: shopify
  # Pin to the lowest release the plugin supports (plugin.json "requires")
  # once the core tags it; main until then.
  INVENTOROS_REF: ${{ inputs.inventoros_ref || 'main' }}

jobs:
  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate GitHub Actions workflows
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -color

  ui:
    name: UI bundle
    needs: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the runtime bundle
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  tests:
    name: tests (${{ matrix.database }})
    needs: ui
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            config: phpunit.xml
            port: ''
            username: ''
          - database: pgsql
            config: phpunit.pgsql.xml
            port: 5432
            username: inventoros
          - database: mysql
            config: phpunit.mysql.xml
            port: 3306
            username: root

    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: inventoros_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: inventoros
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: inventoros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U inventoros"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: secret

    steps:
      - name: Check out Inventoros
        uses: actions/checkout@v4
        with:
          repository: Inventoros/Inventoros
          ref: ${{ env.INVENTOROS_REF }}
          path: core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql, dom, filter, gd, json, libxml, openssl, pcre, phar, tokenizer, zip, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: core
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('core/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Inventoros
        working-directory: core
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      # The plugin goes into plugins/ only after composer install: the core's
      # "Plugins\\" => plugins/ PSR-4 rule would otherwise scan the plugin's
      # classes and warn that each one "does not comply with psr-4 autoloading
      # standard" (harmless: the plugin loads them with its own autoloader,
      # bootstrap.php).
      - name: Check out the plugin into plugins/
        uses: actions/checkout@v4
        with:
          path: core/plugins/${{ env.PLUGIN_SLUG }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: core/plugins/${{ env.PLUGIN_SLUG }}/dist

      - name: Run the plugin's tests inside Inventoros
        working-directory: core
        run: vendor/bin/phpunit --colors=always -c plugins/${{ env.PLUGIN_SLUG }}/${{ matrix.config }}

      - name: Run the core plugin-system tests with this plugin installed
        if: matrix.database == 'sqlite'
        working-directory: core
        run: php artisan test --filter=Plugin

  package:
    name: package + install from ZIP
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: plugin/dist

      - name: Check out Inventoros
        uses: actions/checkout@v4
        with:
          repository: Inventoros/Inventoros
          ref: ${{ env.INVENTOROS_REF }}
          path: core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, filter, gd, json, libxml, openssl, pcre, phar, tokenizer, zip, bcmath
          coverage: none

      - name: Install Inventoros with a real database
        working-directory: core
        run: |
          composer install --no-interaction --prefer-dist --no-dev
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Build the ZIP
        id: zip
        working-directory: plugin
        run: echo "path=$(php bin/package.php)" >> "$GITHUB_OUTPUT"

      - name: Install, activate, deactivate and delete the ZIP
        run: php plugin/bin/verify-package.php core "${{ steps.zip.outputs.path }}" "${{ env.PLUGIN_SLUG }}"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: plugin/build/
          if-no-files-found: error
          retention-days: 7
