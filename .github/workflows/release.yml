name: Release

# Push a tag vX.Y.Z (matching "version" in plugin.json) to publish a GitHub
# release with the installable ZIP and its sha256. The marketplace imports the
# ZIP and signs it with its own key:
#   php artisan marketplace:import-release-asset <slug> <zip url> --changelog="..."
# Paid plugins live in private repositories, whose release assets need a
# token to download: submit those through inventoros.com/developer instead.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PLUGIN_SLUG: shopify
  INVENTOROS_REF: main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check the tag matches plugin.json
        working-directory: plugin
        run: |
          version=$(php -r 'echo json_decode(file_get_contents("plugin.json"), true)["version"];')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin.json version $version" >&2
            exit 1
          fi
          grep -q "## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$version] section" >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the runtime bundle
        working-directory: plugin/ui
        run: |
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, filter, gd, json, libxml, openssl, pcre, phar, tokenizer, zip, bcmath
          coverage: none

      - name: Check out Inventoros
        uses: actions/checkout@v4
        with:
          repository: Inventoros/Inventoros
          ref: ${{ env.INVENTOROS_REF }}
          path: core

      - name: Install Inventoros with a real database
        working-directory: core
        run: |
          composer install --no-interaction --prefer-dist --no-dev
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Build the ZIP
        id: zip
        working-directory: plugin
        run: echo "path=$(php bin/package.php)" >> $GITHUB_OUTPUT

      - name: Verify the ZIP installs and uninstalls cleanly
        run: php plugin/bin/verify-package.php core "${{ steps.zip.outputs.path }}" "${{ env.PLUGIN_SLUG }}"

      - name: Publish the GitHub release
        working-directory: plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          notes=$(awk "/^## \\[$version\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" \
            "build/${PLUGIN_SLUG}-${version}.zip" \
            "build/${PLUGIN_SLUG}-${version}.zip.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes"
